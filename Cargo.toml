[package]
edition = "2024"
name    = "share-fd"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi        = { version = "3.8.2", features = ["napi6", "tokio_rt"] }
napi-derive = "3.5.1"
tokio = { version = "1.49.0", features = ["full"] }
ulid        = "1.2.1"

[build-dependencies]
napi-build = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Pipes",
  "Win32_System_IO",
] }

[profile.release]
lto   = true
strip = "symbols"
